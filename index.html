<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AQ Data Test P0</title><style>body{background:#0b1121;color:#e6efff;font:16px -apple-system,BlinkMacSystemFont,sans-serif;margin:0;padding:24px}main{max-width:850px;margin:auto}h1{font-size:25px}p{line-height:1.7;color:#aab9d1}.card{background:#152039;border:1px solid #2d405e;border-radius:14px;padding:18px;margin:15px 0}button{background:#487cff;color:white;border:0;border-radius:9px;padding:12px 18px;font-weight:600;font-size:16px}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.6}.good{color:#58d7a0}.bad{color:#ff8888}small{color:#b7c4db}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #34435d;text-align:left}</style></head><body><main><h1>🔬 AQ Data Test P0｜免费行情接口检测台</h1><p>独立测试新浪、腾讯、东方财富的连接、耗时和样本返回数量。<b>不会产生买入信号，不会把样本数量冒充全A股覆盖率。</b></p><div class="card"><button id="run">开始一轮测试</button> <small id="status">尚未测试</small><p>建议交易时段与收盘后分别测试，并保留结果截图。测试会从Cloudflare服务器发起请求。</p></div><div class="card"><table><thead><tr><th>数据源</th><th>状态</th><th>耗时</th><th>返回数量</th></tr></thead><tbody id="rows"><tr><td colspan="4">等待测试</td></tr></tbody></table></div><div class="card"><h3>原始检测结果</h3><pre id="details">尚无结果</pre></div><p>说明：三家免费网页接口都可能限流或改变格式。东方财富报告的总数需核验股票范围；单次成功不等于长期稳定。正式选型应在多个交易日、多时段重复测试。</p></main><script>const names={sina:'新浪',tencent:'腾讯',eastmoney:'东方财富'};document.querySelector('#run').onclick=async()=>{const b=document.querySelector('#run'),s=document.querySelector('#status'),rows=document.querySelector('#rows'),d=document.querySelector('#details');b.disabled=true;s.textContent='正在检测…';rows.innerHTML='';const results=[];for(const source of Object.keys(names)){const start=performance.now();let x;try{const r=await fetch('/probe?source='+source+'&t='+Date.now(),{cache:'no-store'});x=await r.json()}catch(e){x={ok:false,source,error:String(e)}}results.push(x);const tr=document.createElement('tr');for(const val of [names[source],x.ok?'成功':'失败',x.ms!=null?x.ms+' ms':Math.round(performance.now()-start)+' ms',x.returned??'—']){const td=document.createElement('td');td.textContent=val;tr.appendChild(td)}tr.children[1].className=x.ok?'good':'bad';rows.appendChild(tr)}d.textContent=JSON.stringify(results,null,2);s.textContent='完成 · '+new Date().toLocaleString('zh-CN');b.disabled=false};</script></body></html>
